[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iris-vector-rag"
version = "0.16.2"
description = "Enterprise RAG pipelines with native IRIS vector search. 6 production implementations with RAGAS evaluation, LangChain, AWS/Azure configs. No external VectorDB required."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "InterSystems", email = "support@intersystems.com"}
]
maintainers = [
    {name = "Thomas Dyar", email = "thomas.dyar@intersystems.com"}
]
keywords = [
    "rag",
    "vector-search",
    "langchain",
    "ragas",
    "enterprise-ai",
    "iris",
    "intersystems",
    "retrieval-augmented-generation"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Database",
    "Topic :: Text Processing :: Linguistic"
]
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0.0",
    "anthropic>=0.25.0",
    "sentence-transformers>=5.2.0,<6.1.0",
    "transformers>=4.41.0,<5.17.0",
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "pyyaml>=6.0",
    "requests>=2.28.0",
    "tqdm>=4.64.0",
    "typing-extensions>=4.0.0",
    "psutil>=7.0.0",
    "intersystems-irispython>=5.1.2",
    # Unified top-level `iris` module (external dbapi + embedded); pinned explicitly so
    # install order cannot leave the bare driver's `iris` package in place.
    "iris-embedded-python-wrapper>=0.5.20",
    # Graph engine for HybridGraphRAG. 4.x makes embeddings graph-scoped (storage layout
    # break, migrated by `upgrade_to_4_0_0`); 5.0 removes what 4.x deprecates.
    "iris-vector-graph>=4.2.0,<5",
    "langchain-openai>=0.3.24",
    "langchain>=0.3.25",
    "python-dotenv>=1.1.0",
    "matplotlib>=3.10.3",
    "ragas>=0.2.15",
    "seaborn>=0.13.2",
    "plotly>=6.1.2",
    "jaydebeapi>=1.2.3",
    "docker>=6.1.3",
    "tiktoken>=0.5.0",
    "torch>=2.0.0",
]

[project.optional-dependencies]
embedding = [
    "torch>=2.0.0",
    "sentence-transformers>=5.2.0,<6.1.0",
    "transformers>=4.41.0,<5.17.0",
    "iris-vector-graph>=4.2.0,<5"
]
hybrid-graphrag = [
    "iris-vector-graph>=4.2.0,<5"
]
monitoring = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0"
]
enterprise = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0",
    "tqdm>=4.64.0"
]
dev = [
    "uv>=0.1.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-dotenv>=0.5.2",
    "pytest-mock>=3.12.0",
    "pytest-timeout>=2.2.0",
    "iris-devtester>=1.11.1",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
    "build>=0.10.0",
    "twine>=4.0.0"
]
mcp = [
    "mcp>=1.9.0,<2"
]
dspy = [
    "dspy-ai>=2.4.0"
]
all = [
    "uv>=0.1.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.12.0",
    "pytest-timeout>=2.2.0",
    "iris-devtester>=1.11.1",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
    "build>=0.10.0",
    "twine>=4.0.0",
    "mcp>=1.9.0,<2",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0",
    "tqdm>=4.64.0"
]

[dependency-groups]
dev = [
    "uv>=0.1.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.12.0",
    # Makefile `test-unit` and release.yml pass --timeout; undeclared, `uv sync` removes it.
    "pytest-timeout>=2.2.0",
    "iris-devtester>=1.11.1",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
    "build>=0.10.0",
    "twine>=4.0.0",
    "gitpython==3.1.61",
]
mcp = [
    "mcp>=1.9.0,<2"
]

[project.urls]
Homepage = "https://github.com/intersystems-community/iris-vector-rag"
Documentation = "https://github.com/intersystems-community/iris-vector-rag/tree/main/docs"
Repository = "https://github.com/intersystems-community/iris-vector-rag"
"Bug Tracker" = "https://github.com/intersystems-community/iris-vector-rag/issues"
Changelog = "https://github.com/intersystems-community/iris-vector-rag/blob/main/CHANGELOG.md"

[project.scripts]
iris-vector-rag-mcp = "iris_vector_rag.mcp.__main__:main"

[tool.setuptools.packages.find]
include = ["iris_vector_rag*"]

[tool.setuptools.package-data]
iris_vector_rag = [
    "config/*.yaml",
    "config/*.json",
    "templates/*.yaml",
    "templates/*.json",
    "mcp/*.json",
    "pipelines/colbert_iris/sp/ColBERTSearch.cls"
]

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["iris_vector_rag", "adapters", "evaluation_framework"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.lint.isort]
known-first-party = ["iris_vector_rag", "adapters", "evaluation_framework"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "intersystems_iris.*",
    "sentence_transformers.*",
    "openai.*",
    "anthropic.*"
]
ignore_missing_imports = true

[tool.pytest.ini_options]
# The single pytest config. There used to be a pytest.ini as well, opening with
# the setup.cfg-only header [tool:pytest]; pytest treated it as the config file,
# read nothing out of it, and ignored this block. Keep the settings here.
minversion = "7.0"
addopts = "-ra --strict-markers --strict-config --tb=short --durations=10"
asyncio_mode = "auto"
testpaths = ["tests"]
norecursedirs = [
    ".git",
    ".venv",
    "venv",
    "node_modules",
    "__pycache__",
    ".pytest_cache",
    "htmlcov",
    # Tests written against APIs that do not exist yet — collected only when a
    # feature picks them up and moves them out.
    "future_features",
    "future_tests_not_ready",
]
timeout = 300
timeout_method = "thread"
# A test stuck in a C call (the IRIS driver) cannot be interrupted by a signal; after this
# long pytest dumps every thread's stack so the hang names its own call site.
faulthandler_timeout = 300
markers = [
    # Scope
    "unit: test one component in isolation, no external services",
    "integration: test component interactions",
    "e2e: end-to-end test of a complete user workflow",
    "true_e2e: end-to-end against real IRIS and a real embedding model",
    "smoke: minimal IRIS ingest+query, gates PR-integration",
    "contract: defines expected behaviour; must fail before implementation",
    "tdd_compliant: follows the TDD workflow",
    "implementation_commit(commit_sha): commit where implementation was added",
    "benchmark: performance benchmark",
    "performance: performance characteristics, not correctness",
    "security: security-related test",
    "slow: takes a long time (deselect with '-m \"not slow\"')",
    # Environment the test needs
    "requires_docker: needs Docker running",
    "requires_database: needs a database connection",
    "requires_real_database: needs a real IRIS instance, no fakes",
    "requires_real_data: needs a populated corpus, not synthetic documents",
    "requires_internet: needs internet access",
    "requires_llm: needs LLM API access",
    "requires_llm_api: alias for requires_llm",
    "requires_redis: needs a Redis connection",
    "requires_vector_store: needs vector store access",
    "requires_backend_mode: needs a specific IRIS backend mode (community or enterprise)",
    "iris_required: needs IRIS reachable on the project port",
    "clean_iris: needs the IRIS tables emptied first",
    "mcp: MCP integration test",
    # Fixtures a test opts into
    "dat_fixture: uses the DAT-restored fixture database",
    "pmc_data: uses the PMC document corpus",
    # Feature 036 pipeline suites
    "error_handling: error handling and diagnostic message validation",
    "fallback: fallback mechanism validation",
    "dimension: embedding dimension validation",
    "basic_rag: BasicRAG pipeline",
    "basic_rerank: BasicRerankRAG pipeline",
    "crag: CRAG pipeline",
    "pylate_colbert: PyLateColBERT pipeline",
    "good_errors: exemplary three-part error messages",
]
filterwarnings = [
    # A dependency deprecating something we call must fail the run, not scroll by.
    "error",
    # transformers < 4.44 passes `resume_download` to huggingface_hub >= 0.26, which warns
    # on every model download. The pin allows transformers 4.41, and before the test
    # embedder stopped standing in for a model that would not load, this error was
    # swallowed and the suite ran on noise. Not ours to fix; delete when the floor moves.
    "ignore:.resume_download. is deprecated:FutureWarning",
    # Below: only our own deprecations, and only where a test exercises the
    # deprecated surface deliberately. Each one goes away with the code it names,
    # so delete the entry when the API is removed rather than adding to the list.
    #
    # tests/conftest.py's `connection_pool` fixture hands the deprecated testing
    # pool to the contract tests that cover it. Its own message points at
    # IRISConnectionPool, which 0.15 removed; the replacement is
    # iris_vector_rag.session.session_for().
    "ignore:ConnectionPool \\(testing module\\) is deprecated:DeprecationWarning",
    # tests/contract/test_iris_connection_contract.py is the contract for
    # get_iris_connection() itself, deprecated in 0.15 and removed in 0.16.
    "ignore:get_iris_connection\\(\\) is deprecated:DeprecationWarning",
    # iris_vector_rag.dspy_modules announces that it is experimental (spec 073) on
    # import; the tests that exercise the DSPy adapters import it deliberately.
    "ignore:The dspy_modules package is experimental:FutureWarning",
    # The only third-party entries, and they buy time rather than silence: ragas
    # 0.4 deprecated both halves of the API this repo calls -- the metric
    # singletons in ragas.metrics (now ragas.metrics.collections) and evaluate()
    # itself (now the @experiment decorator) -- and drops them in v1.0. Neither
    # is a rename: collections metrics are BaseMetric classes taking an
    # instructor-wrapped LLM at construction, and they do not plug into
    # evaluate(). Four call sites need the migration together --
    # tests/contract/test_ragas_validation_contract.py,
    # examples/custom_pipeline.py, examples/compare_pipelines.py,
    # scripts/simple_working_ragas.py. Delete these two entries with that work.
    "ignore:Importing .* from 'ragas\\.metrics' is deprecated:DeprecationWarning",
    # evaluate() and the aevaluate() it delegates to warn separately.
    "ignore:a?evaluate\\(\\) is deprecated and will be removed:DeprecationWarning",
]
# No log_file/log_cli defaults. The dead pytest.ini asked for log_file_level =
# DEBUG, which turns DEBUG capture on for every run: caplog then sees records a
# test never asked for, and any test that fakes the clock gets asked for the time
# once per log record. Pass --log-file / --log-cli-level when debugging a run.
junit_suite_name = "rag-templates-test-suite"
junit_logging = "system-out"
junit_log_passing_tests = false

[tool.coverage.run]
source = ["iris_vector_rag", "adapters", "evaluation_framework"]
omit = [
    "*/tests/*",
    "*/test_*",
    "setup.py"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:"
]

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
bump = true
fallback-version = "0.0.0"
