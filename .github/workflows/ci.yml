name: CI/CD Pipeline

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  PYTHON_DEFAULT_VERSION: "3.12"

jobs:
  format-check:
    name: Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT_VERSION }}

      - name: Install black
        run: pip install "black==26.5.1"

      - name: Check black formatting
        run: |
          black --check iris_vector_rag/ tests/

  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT_VERSION }}

      - name: Install ruff
        run: pip install ruff

      - name: Check ruff (syntax errors only)
        run: |
          ruff check iris_vector_rag/ tests/ \
            --select=E9,F63,F7,F82 \
            --output-format=github

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: |
          uv sync --extra dev --extra mcp --extra api

      # A failure listed in tests/contract/ci_known_failures.txt is quarantined.
      # Any other failure turns this job red.
      - name: Run unit tests
        env:
          SKIP_IRIS_CONTAINER: "1"
        run: |
          DESELECT=$(sed 's/^/--deselect=/' tests/contract/ci_known_failures.txt | tr '\n' ' ')
          uv run pytest tests/unit/ $DESELECT \
            --timeout=60 \
            --tb=short \
            --junit-xml=test-results-unit.xml \
            -q

      - name: Upload test results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-results-unit-${{ matrix.python-version }}
          path: test-results-unit.xml
          if-no-files-found: ignore
