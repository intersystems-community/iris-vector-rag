name: PR Integration Tests

on:
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened]

env:
  PYTHON_DEFAULT_VERSION: "3.12"
  IRIS_PORT: 1972

jobs:
  smoke-tests:
    name: IRIS Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # Not a `services:` container: the 2026.1 image's post-start init crashes on
      # amd64 and the services health check then kills the job. The script starts
      # IRIS with that init skipped and unexpires the default password.
      - name: Start IRIS
        run: bash scripts/ci/start-iris.sh

      - name: Set up Python ${{ env.PYTHON_DEFAULT_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT_VERSION }}

      - name: Install package and test dependencies
        run: |
          pip install -e ".[dev,evaluation]" \
            intersystems-irispython>=5.1.2 \
            iris-vector-graph>=2.1.0

      - name: Run smoke tests
        env:
          IRIS_HOST: localhost
          IRIS_PORT: 1972
          IRIS_USERNAME: _SYSTEM
          IRIS_PASSWORD: SYS
          IRIS_NAMESPACE: USER
        run: |
          python -m pytest tests/contract/test_smoke.py \
            -m smoke \
            -v \
            --tb=short \
            -x
